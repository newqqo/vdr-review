name: vdr-ci

# Every change runs the public-content check, including docs and ignore rules.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-vdr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/vdr_review/requirements-test.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install codec reference and minimal test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          node --version
          ffmpeg -version
          python -m pip install -r scripts/vdr_review/requirements-test.txt

      - name: Check that only allowlisted, case-free files are published
        run: python scripts/vdr_review/check_public.py

      - name: Build
        run: python scripts/vdr_review/build.py --out output/VDR-review.html --package output/VDR-review.zip

      - name: Test
        run: python scripts/vdr_review/run_tests.py --root . --basetemp "${{ runner.temp }}/vdr-pytest"
